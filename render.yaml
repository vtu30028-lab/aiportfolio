# Render Infrastructure Blueprint for PortfolioAI
services:
  - type: web
    name: portfolioai-web
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolioai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false

databases:
  - name: portfolioai-db
    databaseName: portfolio_ai
    user: portfolio_user
    plan: free
