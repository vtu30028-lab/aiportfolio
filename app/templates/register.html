{% extends "base.html" %}

{% block title %}Create Account — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Create Your Account</h3>
                    <p class="text-muted small">Start crafting your AI-powered tech portfolio today</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">

                    <div class="mb-3">
                        <label for="name" class="form-label text-light small fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Alex Rivera" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-light small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="alex@university.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-light small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                        </div>
                        <div class="form-text text-muted small">Must contain minimum 8 characters with letters & numbers.</div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 justify-content-center mb-3">
                        <i class="bi bi-rocket-takeoff-fill"></i> Create Free Account
                    </button>

                    <div class="text-center text-muted small">
                        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
