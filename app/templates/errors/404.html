{% extends "base.html" %}

{% block title %}404 — Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="glass-card max-w-600 mx-auto p-5">
        <div class="display-1 fw-bold gradient-accent font-monospace mb-2">404</div>
        <h2 class="text-white fw-bold mb-3">Resource Not Found</h2>
        <p class="text-muted mb-4">
            The page or portfolio you are searching for does not exist or has been moved.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-gradient px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
